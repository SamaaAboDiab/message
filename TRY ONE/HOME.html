<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Message</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/x-icon" href="/creativity.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/creativity.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/creativity.png" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body style="
    background-image: url('dec7ff62d7658435d2becdcd16c3b230.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    min-height: 100vh;
    margin: 0;
    padding: 0;
">

<section>
    <div class="letter-container">
        <div class="letter-paper">
            <h1 style="text-align: center; margin-top: 20px; color: #333;">A Letter To who was a brother to me before even being a colleague...</h1>
            <p style="margin: 20px; font-size: 25px; line-height: 1.6; color: #66415d; font-family: serif;"></p>
        </div>
    </div>
</section>

<script>
    const fullText = `Dear Osama,

I hope this letter finds you well. I wanted to express my gratitude for every time you were a brother to me, before even being a college friend.

Fate, college, and striving brought us together… and we were like brothers. I learned so much from you, and all along, I’ve always felt proud of you.

I am grateful for this beautiful coincidence, and I thank you for all your support and constant friendship.

I hope the remaining days of college and exams pass peacefully, and that your days are filled with happiness, dear. 💞

With heartfelt appreciation`;

    const words = fullText.split(' ');
    const container = document.querySelector('.letter-paper p');
    container.innerHTML = '';
    
    const textContainer = document.createElement('span');
    textContainer.style.whiteSpace = 'pre-wrap';
    textContainer.style.wordWrap = 'break-word';
    container.appendChild(textContainer);
    
    const cursor = document.createElement('span');
    cursor.innerHTML = '|';
    cursor.style.animation = 'blink 1s step-end infinite';
    cursor.style.color = '#66415d';
    cursor.style.fontWeight = 'bold';
    container.appendChild(cursor);
    
    const style = document.createElement('style');
    style.textContent = `
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    `;
    document.head.appendChild(style);
    
    const totalTime = 30000;
    const timePerWord = totalTime / words.length;
    let index = 0;
    
    function typeNextWord() {
        if (index < words.length) {
            textContainer.innerHTML += (index === 0 ? '' : ' ') + words[index];
            index++;
            setTimeout(typeNextWord, timePerWord);
        } else {
            cursor.style.display = 'none';
        }
    }
    
    typeNextWord();
</script>

</body>
</html>
